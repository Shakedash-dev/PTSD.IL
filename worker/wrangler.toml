name = "ptsd-chatbot-worker"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_ORIGIN = "https://ptsd-il.site,https://www.ptsd-il.site,https://ptsd-il-44y7.onrender.com"
API_BASE = "https://ptsd-il-api.onrender.com/api"
GEMINI_MODEL = "gemini-flash-latest"
ADMIN_VERIFY_URL = "https://ptsd-il-api.onrender.com/api/admin/articles"
TRANSLATE_MODEL = "gemini-4-argon"
QA_STRONG = "0.80"
QA_WEAK = "0.72"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "ptsd-chatbot"

[[kv_namespaces]]
binding = "RL"
id = "6167ce06f6fa4f859f9e314313ef59ae"

# Staging: a second Worker for testing chat changes locally before they ship
# (docs/chatbot-guide.md section 19). Vars and bindings are not inherited by an
# env, so all of them are repeated here. Same content API and KV namespace as
# production; its own Vectorize index, and its own KV key for the playbook
# index, so a staging reindex never touches what the live chatbot reads.
[env.staging]
name = "ptsd-chatbot-worker-staging"

[env.staging.vars]
SITE_ORIGIN = "https://ptsd-il.site,https://www.ptsd-il.site,https://ptsd-il-44y7.onrender.com,http://localhost:5173"
API_BASE = "https://ptsd-il-api.onrender.com/api"
GEMINI_MODEL = "gemini-flash-latest"
ADMIN_VERIFY_URL = "https://ptsd-il-api.onrender.com/api/admin/articles"
TRANSLATE_MODEL = "gemini-4-argon"
QA_STRONG = "0.80"
QA_WEAK = "0.72"
QA_INDEX_KEY = "qa:index:staging:v1"

[env.staging.ai]
binding = "AI"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "ptsd-chatbot-staging"

[[env.staging.kv_namespaces]]
binding = "RL"
id = "6167ce06f6fa4f859f9e314313ef59ae"
